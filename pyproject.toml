[tool.ruff]
line-length = 160
target-version = "py312"
exclude = [".venv", "__pycache__", "output"]

[tool.ruff.lint]
select = ["E", "F", "I"]              # базові помилки + імпорти
ignore = ["E501", "E701", "E722", "F841"]  
# E501: довгі рядки (у нас довгі службові тексти)
# E701: кілька операторів в одному рядку (не критично)
# E722: bare except (поправимо пізніше, зараз не блокуємо)
# F841: «змінна не використовується» (не блокуємо, приберемо поступово)
