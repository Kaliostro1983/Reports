[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  ".venv",
  "__pycache__",
  "output",
]

[tool.ruff.lint]
select = ["E", "F", "I"]  # базова чистота: Pycodestyle/pyflakes + імпорти
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
